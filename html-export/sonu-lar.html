<body class="bg-background text-foreground m-0 p-0">
  <div class="h-screen w-screen overflow-hidden">
    <div class="min-h-screen w-full bg-background text-foreground font-body pb-8">

        <section class="mb-5">

            <button class="flex items-center gap-1.5 text-xs font-bold text-primary">

          </div>

          <div class="space-y-3">
            <button class="group block w-full rounded-theme border border-primary/35 bg-card p-4 text-left shadow-[0_5px_18px_rgba(0,0,0,0.12)] transition-colors">

                  </div>
                  <p class="font-heading text-[15px] font-bold leading-5 text-card-foreground">Yargıtay 21. Hukuk Dairesi</p>
                  <div class="mt-2 grid grid-cols-2 gap-y-1 font-mono text-[10px] text-muted-foreground">

                    <span>Karar <b class="font-semibold text-secondary-foreground">2023/8890</b></span>
                    <span class="col-span-2">14.03.2023</span>
                  </div>
                </div>

                </div>

            </button>

            <button class="group block w-full rounded-theme border border-border bg-card p-4 text-left shadow-[0_5px_18px_rgba(0,0,0,0.1)]">

                  <div class="mt-2 grid grid-cols-2 gap-y-1 font-mono text-[10px] text-muted-foreground">

                    <span>Karar <b class="font-semibold text-secondary-foreground">2022/11642</b></span>
                    <span class="col-span-2">22.12.2022</span>

                <div class="mt-3 flex items-center justify-between">

  <script>
    // Icon self-healing: a missing icon name renders as INVISIBLE empty space
    // (iconify-icon fails silently). Its `status` property ('rendered' |
    // 'loading' | 'failed') lets us swap failures to a neutral glyph.
    (function() {
      var els = document.querySelectorAll('iconify-icon');
      for (var i = 0; i < els.length; i++) (function(el) {
        var tries = 0;
        (function check() {
          var s = el.status;
          if (s === 'failed') el.setAttribute('icon', 'lucide:circle');
          else if (s !== 'rendered' && tries++ < 40) setTimeout(check, 250);
        })();
      })(els[i]);
    })();
  </script>
